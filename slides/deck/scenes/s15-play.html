      tl.fromTo("#s15-tabs", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.36, ease: "power2.out", immediateRender: false }, 0.08);
      tl.fromTo("#s15-stage", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, 0.2);
      tl.fromTo("#s15-note", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out", immediateRender: false }, 0.4);
      window.__timelines["play"] = tl;

      /* 选项卡切换（事件驱动）+ 切换即暂停全部视频 */
      var tabs = document.querySelectorAll(".s15-tab");
      var panels = document.querySelectorAll(".s15-panel");
      var videos = document.querySelectorAll("#s15-stage video");
      tabs.forEach(function (t) {
        t.addEventListener("click", function () {
          tabs.forEach(function (x) { x.classList.remove("on"); });
          panels.forEach(function (x) { x.classList.remove("on"); });
          videos.forEach(function (v) { try { v.pause(); } catch (e) {} });
          t.classList.add("on");
          document.getElementById(t.dataset.panel).classList.add("on");
        });
      });
    })();
  </script>
