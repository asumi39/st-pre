# nginx http{} 块的限流区定义（deploy 阶段拷进 /etc/nginx/conf.d/ 或主配置）
# live：LIVE 演示代理（2r/s，burst 5）
limit_req_zone $binary_remote_addr zone=live:10m rate=2r/s;
# play：体验站认证端点限流（登录/注册/改密）。/play/ 静态资源与聊天【不参与】——
# 冷启动一次拉 ~200 文件，逐 IP 限流会把整次启动打成 429（2026-11-07 生产教训）
limit_req_zone $binary_remote_addr zone=play:10m rate=10r/s;
